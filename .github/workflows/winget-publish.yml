name: Publish to WinGet
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.6)'
        required: true
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Update and submit to winget
        run: |
          $tag = if ("${{ github.event.release.tag_name }}") { "${{ github.event.release.tag_name }}" } else { "${{ github.event.inputs.tag }}" }
          $version = $tag.TrimStart('v')
          $url = "https://github.com/markolo10/convo-releases/releases/download/${tag}/convo-setup.exe"
          $notesUrl = "https://github.com/markolo10/convo-releases/releases/tag/${tag}"
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update MarkusKellermann.Convo --urls $url --version $version --architecture x64 --release-notes-url $notesUrl --submit --token ${{ secrets.WINGET_TOKEN }}
