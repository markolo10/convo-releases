name: Publish to WinGet
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MarkusKellermann.Convo
          installers-regex: 'convo-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
